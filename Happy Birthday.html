<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#fff4ef; --ink:#3a1530; --soft:#7a4a68; --rose:#e8456f; --gold:#c98a1b; --card:#ffffff; --glow:#ffd3df;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1c0f24; --ink:#ffeaf1; --soft:#d9a9c0; --rose:#ff7a9c; --gold:#f5c76b; --card:#2b1736; --glow:#4b2142}
}
:root[data-theme="dark"]{--bg:#1c0f24; --ink:#ffeaf1; --soft:#d9a9c0; --rose:#ff7a9c; --gold:#f5c76b; --card:#2b1736; --glow:#4b2142}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
.serif{font-family:"Fraunces",Georgia,serif}
.view{display:none;min-height:100vh}
.view.on{display:block}

/* Page 1 */
#home{position:relative;display:none;align-items:center;justify-content:center;text-align:center;padding:48px 20px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,var(--glow),transparent 65%),var(--bg)}
#home.on{display:flex}
.drift{position:absolute;inset:0;pointer-events:none}
.drift figure{position:absolute;margin:0;width:clamp(86px,17vw,170px);padding:7px 7px 22px;background:var(--card);border-radius:3px;
  box-shadow:0 14px 34px rgba(120,30,70,.22);animation:bob 9s ease-in-out infinite}
.drift img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px}
@keyframes bob{50%{transform:translateY(-14px) rotate(var(--r))}}
.hero{position:relative;z-index:2;max-width:760px}
.to{font-style:italic;font-size:clamp(1.1rem,3.4vw,1.5rem);color:var(--soft);margin:0 0 6px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:clamp(3.4rem,15vw,9rem);line-height:.92;letter-spacing:-.03em;margin:0;color:var(--rose)}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em) rotate(4deg);animation:pop .8s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.name{font-family:"Fraunces",Georgia,serif;font-weight:300;font-style:italic;font-size:clamp(2rem,8vw,4.2rem);margin:.15em 0 .5em}
.msg{font-size:clamp(1rem,2.6vw,1.2rem);color:var(--soft);max-width:34em;margin:0 auto 2rem}
.btn{font:500 1.05rem "DM Sans",sans-serif;border:0;cursor:pointer;color:#fff;background:var(--rose);padding:.95em 2.2em;border-radius:999px;
  box-shadow:0 10px 26px rgba(232,69,111,.4);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:focus-visible,.ghost:focus-visible,.tools button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--soft);box-shadow:none}

/* Page 2 */
#memories{padding:56px 18px 90px}
.head{text-align:center;max-width:640px;margin:0 auto 40px}
.head h2{font-family:"Fraunces",Georgia,serif;font-size:clamp(2rem,7vw,3.4rem);margin:0 0 8px;color:var(--rose)}
.head p{color:var(--soft);margin:0}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:36px 28px}
.mem{margin:0;background:var(--card);padding:12px 12px 22px;border-radius:6px;box-shadow:0 16px 38px rgba(120,30,70,.16);transform:rotate(var(--r,0deg))}
.mem:nth-child(3n+1){--r:-1.2deg}.mem:nth-child(3n+2){--r:1deg}.mem:nth-child(3n){--r:-.5deg}
.ph{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:3px;background:var(--glow)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{margin:16px 6px 0}
.cap h3{font-family:"Fraunces",Georgia,serif;font-size:1.3rem;margin:0 0 4px}
.cap p{margin:0;color:var(--soft)}
.end{text-align:center;margin-top:56px}
.end .serif{font-size:clamp(1.4rem,5vw,2.2rem);font-style:italic;color:var(--gold);margin:0 0 20px}

/* Edit mode */
.tools{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tools button{font:500 .85rem "DM Sans",sans-serif;cursor:pointer;padding:.5em 1em;border-radius:999px;border:1px solid var(--soft);background:var(--card);color:var(--ink)}
.editing [contenteditable]{outline:2px dashed var(--gold);outline-offset:3px;border-radius:4px;cursor:text}
.editing .ph{cursor:pointer}
.editing .ph::after{content:"Tap to change photo";position:absolute;inset:auto 0 0 0;text-align:center;padding:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.85rem}
.rm{display:none;margin-top:10px;font-size:.8rem;color:var(--rose);background:none;border:0;cursor:pointer;text-decoration:underline}
.editing .rm{display:inline-block}
.addbar{display:none;text-align:center;margin-top:30px}
.editing .addbar{display:block}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);max-width:560px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog textarea{width:100%;height:220px;font:12px monospace;padding:10px;border-radius:8px;border:1px solid var(--soft);background:var(--bg);color:var(--ink)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ===== YOUR CONTENT: edit here, or use the Edit button on the page ===== -->
<script type="application/json" id="config">
{
  "name": "My Love",
  "greeting": "Happy Birthday",
  "message": "Another year of you is the best gift I’ve ever been given. I made this little place for the moments I treasure most.",
  "galleryTitle": "Our Love Memories",
  "galleryIntro": "A few of my favourite moments with you.",
  "closing": "I love you, today and always.",
  "memories": [
    { "title": "The day we met",  "text": "I didn’t know it yet, but my whole life was about to change.", "photo": "" },
    { "title": "Our first trip",  "text": "Every road felt like home as long as you were next to me.", "photo": "" },
    { "title": "Quiet evenings",  "text": "My favourite place in the world is wherever you are.", "photo": "" },
    { "title": "Laughing together","text": "Nobody makes me laugh the way you do.", "photo": "" }
  ]
}
</script>

<main>
  <section id="home" class="view on" aria-label="Birthday greeting">
    <div class="drift" id="drift" aria-hidden="true"></div>
    <div class="hero">
      <p class="to" id="to">For my love</p>
      <h1 id="greet" aria-label="Happy Birthday"></h1>
      <p class="name" id="name" data-k="name"></p>
      <p class="msg" id="message" data-k="message"></p>
      <button class="btn" id="thanks" type="button">Thanks</button>
    </div>
  </section>

  <section id="memories" class="view" aria-label="Our memories">
    <div class="head">
      <h2 data-k="galleryTitle"></h2>
      <p data-k="galleryIntro"></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="addbar"><button class="btn ghost" id="add" type="button">Add a memory</button></div>
    <div class="end">
      <p class="serif" data-k="closing"></p>
      <button class="btn ghost" id="back" type="button">Back to the start</button>
    </div>
  </section>
</main>

<div class="tools">
  <button id="editBtn" type="button">Edit</button>
  <button id="dataBtn" type="button">Export / Import</button>
  <button id="themeBtn" type="button">Light / Dark</button>
</div>

<dialog id="dlg">
  <p style="margin:0 0 8px"><strong>Your content as JSON.</strong> Copy it to keep a backup, or paste JSON here and press Import.</p>
  <textarea id="json" spellcheck="false"></textarea>
  <menu><button class="btn ghost" id="closeDlg" type="button">Close</button><button class="btn" id="importBtn" type="button">Import</button></menu>
</dialog>
<input type="file" id="file" accept="image/*" hidden>

<script>
(function(){
  var KEY="birthday-site-v1", $=function(s,r){return (r||document).querySelector(s)};
  var data, editing=false, pickIdx=null;

  // Soft placeholder picture, used until you add a real photo
  function ph(i){
    var c=[["#ff9db5","#ffd9a8"],["#c7a6ff","#ffb3c9"],["#ffc58a","#ff8fab"],["#9fd7ff","#e3b8ff"]][i%4];
    var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><path d="M200 300c-60-40-80-70-80-100a40 40 0 0 1 80-10 40 40 0 0 1 80 10c0 30-20 60-80 100z" fill="#fff" opacity=".8"/></svg>';
    return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
  }
  function load(){
    var base=JSON.parse($("#config").textContent);
    try{var s=localStorage.getItem(KEY); if(s) base=JSON.parse(s);}catch(e){}
    return base;
  }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert("Photos are too large to save in this browser. Try fewer or smaller photos, or use Export to keep a backup.");} }

  function renderText(){
    document.querySelectorAll("[data-k]").forEach(function(el){el.textContent=data[el.dataset.k]||""});
    var g=$("#greet"); g.textContent="";
    data.greeting.split("").forEach(function(ch,i){
      var sp=document.createElement("span"); sp.textContent=ch===" "?"\u00A0":ch; sp.style.animationDelay=(.15+i*.07)+"s"; g.appendChild(sp);
    });
    g.setAttribute("aria-label",data.greeting);
  }
  function renderDrift(){
    var d=$("#drift"); d.textContent="";
    var spots=[["4%","8%",-8],["72%","6%",7],["3%","62%",6],["74%","60%",-6]];
    data.memories.slice(0,4).forEach(function(m,i){
      var f=document.createElement("figure"), im=document.createElement("img");
      im.alt=""; im.src=m.photo||ph(i);
      f.style.left=spots[i][0]; f.style.top=spots[i][1]; f.style.transform="rotate("+spots[i][2]+"deg)";
      f.style.setProperty("--r",spots[i][2]+"deg"); f.style.animationDelay=(i*1.3)+"s";
      f.appendChild(im); d.appendChild(f);
    });
  }
  function renderGrid(){
    var gr=$("#grid"); gr.textContent="";
    data.memories.forEach(function(m,i){
      var f=document.createElement("figure"); f.className="mem";
      var box=document.createElement("div"); box.className="ph"; box.tabIndex=-1;
      var im=document.createElement("img"); im.alt=m.title||"Memory"; im.loading="lazy"; im.src=m.photo||ph(i);
      box.appendChild(im);
      box.addEventListener("click",function(){ if(editing){pickIdx=i; $("#file").click();} });
      var cap=document.createElement("figcaption"); cap.className="cap";
      var h=document.createElement("h3"); h.textContent=m.title; h.dataset.i=i; h.dataset.f="title";
      var p=document.createElement("p"); p.textContent=m.text; p.dataset.i=i; p.dataset.f="text";
      var rm=document.createElement("button"); rm.className="rm"; rm.type="button"; rm.textContent="Remove this memory";
      rm.addEventListener("click",function(){ if(confirm("Remove this memory?")){data.memories.splice(i,1);save();renderGrid();renderDrift();setEdit(true);} });
      cap.appendChild(h); cap.appendChild(p); cap.appendChild(rm);
      f.appendChild(box); f.appendChild(cap); gr.appendChild(f);
    });
  }
  function setEdit(on){
    editing=on; document.body.classList.toggle("editing",on);
    $("#editBtn").textContent=on?"Done":"Edit";
    document.querySelectorAll("[data-k],#grid [data-f]").forEach(function(el){
      if(on) el.setAttribute("contenteditable","plaintext-only"); else el.removeAttribute("contenteditable");
    });
  }
  function commit(e){
    var el=e.target; if(!editing) return;
    if(el.dataset.k){ data[el.dataset.k]=el.textContent.trim(); if(el.dataset.k==="name"||el.dataset.k==="greeting"){} save(); }
    else if(el.dataset.f){ data.memories[+el.dataset.i][el.dataset.f]=el.textContent.trim(); save(); }
  }
  document.addEventListener("focusout",commit);

  // Photo picker: shrink big photos so they fit in browser storage
  $("#file").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f||pickIdx===null) return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=900, k=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        data.memories[pickIdx].photo=c.toDataURL("image/jpeg",.82);
        save(); renderGrid(); renderDrift(); setEdit(true); e.target.value="";
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });

  function go(id){
    document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id===id)});
    window.scrollTo(0,0); try{history.replaceState(null,"","#"+id)}catch(e){}
  }
  $("#thanks").addEventListener("click",function(){go("memories")});
  $("#back").addEventListener("click",function(){go("home")});
  $("#editBtn").addEventListener("click",function(){setEdit(!editing)});
  $("#add").addEventListener("click",function(){
    data.memories.push({title:"A new memory",text:"Write what this moment means to you.",photo:""});
    save(); renderGrid(); renderDrift(); setEdit(true);
  });
  $("#themeBtn").addEventListener("click",function(){
    var r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  });
  $("#dataBtn").addEventListener("click",function(){ $("#json").value=JSON.stringify(data,null,2); $("#dlg").showModal(); });
  $("#closeDlg").addEventListener("click",function(){$("#dlg").close()});
  $("#importBtn").addEventListener("click",function(){
    try{
      var j=JSON.parse($("#json").value); if(!j.memories||!j.greeting) throw 0;
      data=j; save(); renderAll(); $("#dlg").close();
    }catch(e){alert("That JSON doesn’t look right. Check it and try again.");}
  });

  function renderAll(){ renderText(); renderDrift(); renderGrid(); setEdit(false); }
  data=load(); renderAll();
  if(location.hash==="#memories") go("memories");
})();
</script>
</body>
</html>
